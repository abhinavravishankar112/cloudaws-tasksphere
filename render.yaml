# Render Blueprint configuration for Cloud-Native TaskSphere API
# See https://render.com/docs/blueprint-spec for details.

services:
  - type: web
    name: tasksphere-api
    runtime: node
    plan: free
    region: singapore # or oregon, frankfurt, ohio
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://postgres:postgres@localhost:5432/task_manager
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: SWAGGER_ENABLED
        value: "true"
