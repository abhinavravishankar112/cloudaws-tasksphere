apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasksphere-api
  namespace: tasksphere
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  tls:
    - hosts:
        - api.example.com
      secretName: tasksphere-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tasksphere-api
                port:
                  number: 80
